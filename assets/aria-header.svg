<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050810"/>
      <stop offset="100%" stop-color="#0a1420"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#00ffa3"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="260" fill="url(#bgGrad)"/>

  <!-- corner frame ticks -->
  <path d="M20,20 L20,50 M20,20 L50,20" stroke="#00f0ff" stroke-width="2" fill="none"/>
  <path d="M1180,20 L1180,50 M1180,20 L1150,20" stroke="#00f0ff" stroke-width="2" fill="none"/>
  <path d="M20,240 L20,210 M20,240 L50,240" stroke="#00f0ff" stroke-width="2" fill="none"/>
  <path d="M1180,240 L1180,210 M1180,240 L1150,240" stroke="#00f0ff" stroke-width="2" fill="none"/>

  <!-- grid lines background -->
  <g stroke="#12202f" stroke-width="1">
    <line x1="0" y1="65" x2="1200" y2="65"/>
    <line x1="0" y1="195" x2="1200" y2="195"/>
  </g>

  <!-- top label -->
  <text x="600" y="42" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" letter-spacing="6" fill="#4f6b7a">SYSTEM INTERFACE // BOOT SEQUENCE COMPLETE</text>

  <!-- ARIA main title -->
  <text x="600" y="145" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="88" font-weight="bold" letter-spacing="26" fill="url(#cyanGrad)" filter="url(#glow)">ARIA</text>

  <!-- subtitle -->
  <text x="600" y="180" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="15" letter-spacing="4" fill="#7fdcff">AUTONOMOUS &#8226; RESPONSIVE &#8226; INTELLIGENT ASSISTANT</text>

  <!-- operator line -->
  <text x="600" y="222" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="16" letter-spacing="2" fill="#e6f7ff">BHAVIK SUTHAR <tspan fill="#3d5566">//</tspan> SYSTEM OPERATOR</text>

  <!-- side status dots -->
  <circle cx="70" cy="130" r="4" fill="#00ffa3"/>
  <circle cx="1130" cy="130" r="4" fill="#00ffa3"/>
</svg>
